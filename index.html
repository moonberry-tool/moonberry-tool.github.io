    <style>
      /* Instant moon loading screen — pure CSS, shows before any JS downloads,
         so the tab never looks "stuck" on a blank black screen. Swapped out
         automatically once React mounts and replaces #root's content. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0f0714;
        z-index: 9999;
      }
      #initial-loader .mb-moon-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loader .mb-moon-glow {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139,92,246,0.45), transparent 70%);
        animation: mb-pulse 1.8s ease-in-out infinite;
      }
      #initial-loader .mb-moon {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #FEF08A 0%, #FDBA74 25%, #F472B6 55%, #8B5CF6 85%, #6366F1 100%);
        box-shadow: -12px 0 0 -2px #0f0714 inset;
        animation: mb-spin 2.4s linear infinite;
      }
      #initial-loader .mb-brand {
        font-family: 'Alexandria', 'Outfit', system-ui, sans-serif;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.02em;
        color: #ffffff;
        opacity: 0.9;
      }
      #initial-loader .mb-dots span {
        display: inline-block;
        width: 5px;
        height: 5px;
        margin: 0 2px;
        border-radius: 50%;
        background: #f43f5e;
        animation: mb-dot-bounce 1.2s ease-in-out infinite;
      }
      #initial-loader .mb-dots span:nth-child(2) { animation-delay: 0.15s; background: #c026d3; }
      #initial-loader .mb-dots span:nth-child(3) { animation-delay: 0.3s; background: #8b5cf6; }

      @keyframes mb-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes mb-pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes mb-dot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
    </style>
    <script>
      // Companion to 404.html: if we were bounced here from a deep link
      // (e.g. /colors/), restore that path in the address bar before React mounts.
      (function () {
        var redirectPath = sessionStorage.getItem('mb_redirect_path');
        if (redirectPath) {
          sessionStorage.removeItem('mb_redirect_path');
          window.history.replaceState({}, '', redirectPath);
        }
      })();
    </script>
